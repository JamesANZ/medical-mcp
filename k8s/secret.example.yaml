# Optional API keys. Copy this file aside, put real values only in the copy, and
# apply the copy. Do not commit real keys.
#
# `stringData` is plain text in this file. After you apply it, Kubernetes stores
# the values base64-encoded. Encoding is not encryption. Anyone who can read the
# Secret can decode it.
apiVersion: v1
kind: Secret
metadata:
  name: medical-mcp-secrets
  labels:
    app: medical-mcp
type: Opaque
stringData:
  NCBI_API_KEY: ""
  MONID_API_KEY: ""
  TINYFISH_API_KEY: ""
  TYPESAFE_API_KEY: ""
